[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/editor_core",
    "crates/media_engine",
    "crates/ai_services",
    "crates/ui_kit",
    "crates/workspace_ui",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
authors = ["Predit Team"]
license = "Apache-2.0"

[workspace.dependencies]
gpui = "0.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
smallvec = "1.15"
log = "0.4"
rfd = "0.17"

editor_core = { path = "crates/editor_core" }
media_engine = { path = "crates/media_engine" }
ai_services = { path = "crates/ai_services" }
ui_kit = { path = "crates/ui_kit" }
workspace_ui = { path = "crates/workspace_ui" }

# Keep target/ directory small and avoid Windows MSVC LNK1318 / disk space exhaustion
[profile.dev]
debug = false

[profile.dev.package."*"]
debug = false


